name: daily
on:
  schedule:
    - cron: '0 1 * * *'   # UTC 01:00 ≈ 北京 09:00
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD(缺省为 UTC 昨天)'
        required: false

permissions:
  contents: write

concurrency: daily

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Run pipeline
        env:
          PH_API_TOKEN: ${{ secrets.PH_API_TOKEN }}
          TABAPI_KEY: ${{ secrets.TABAPI_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_DATE: ${{ inputs.date }}
        run: |
          EFFECTIVE_DATE="${RUN_DATE:-$(date -u -d 'yesterday' +%F)}"
          echo "EFFECTIVE_DATE=$EFFECTIVE_DATE" >> "$GITHUB_ENV"
          if [ -n "$RUN_DATE" ]; then
            npm run once -- --date="$RUN_DATE"
          else
            npm run daily
          fi
      - name: Commit data
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --cached --quiet || git commit -m "data: ${EFFECTIVE_DATE} run"
          git push
