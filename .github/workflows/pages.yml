name: pages
on:
  push:
    branches: [main]
    paths: ['data/**', 'site/**']
  workflow_run:
    workflows: [daily]
    types: [completed]
  workflow_dispatch:

permissions:
  pages: write
  id-token: read

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/* _site/
          cp -r data _site/data
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
